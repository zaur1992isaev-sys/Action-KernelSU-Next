name: Build Standoff Fix Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc python3

      - name: Download Kernel Source
        run: |
          git clone --depth=1 https://github.com -b lineage-21 kernel

      - name: Patch Touch Driver (The Magic)
        run: |
          cd kernel
          # Заменяем частоту опроса 720/480 на стабильные 240 Гц
          find . -name "*touchpanel_common.c*" -exec sed -i 's/sample_rate = [0-9]*/sample_rate = 240/g' {} +
          # Поднимаем порог чувствительности, чтобы убить микро-свайпы
          find . -name "*touchpanel_common.c*" -exec sed -i 's/touch_threshold = [0-9]*/touch_threshold = 15/g' {} +

      - name: Build GKI Kernel
        run: |
          cd kernel
          # Сборка стандартного GKI образа для 5.10
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make  gki_defconfig
          make -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-Standoff-Fix
          path: kernel/arch/arm64/boot/Image
